<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="field" gradientUnits="userSpaceOnUse" cx="176" cy="156" r="360">
      <stop offset="0" stop-color="#E6D9B9"/>
      <stop offset="1" stop-color="#E4D6B3"/>
    </radialGradient>
    <clipPath id="inner">
      <circle cx="256" cy="256" r="222" fill="#FFFFFF"/>
    </clipPath>
  </defs>

  <!-- field -->
  <circle cx="256" cy="256" r="240" fill="url(#field)"/>

  <g clip-path="url(#inner)">
    <!-- faint compass rose -->
    <circle cx="156" cy="164" r="38" fill="none" stroke="#C9B48A" stroke-width="8"/>
    <polygon fill="#C9B48A" points="156,106 160.6,152.9 182.9,137.1 167.1,159.4 214,164 167.1,168.6 182.9,190.9 160.6,175.1 156,222 151.4,175.1 129.1,190.9 144.9,168.6 98,164 144.9,159.4 129.1,137.1 151.4,152.9"/>

    <!-- dashed trail curving across the field -->
    <path d="M13,432 Q98.9,420.1 148.9,370.1 L361.1,157.9 Q411.1,107.9 497,96" fill="none" stroke="#4A3521" stroke-width="8" stroke-linecap="round" stroke-dasharray="14 20" stroke-opacity="0.45"/>

    <!-- two pairs of footprints walking up the trail (left feet mirrored) -->
    <g transform="translate(136.2,331.8) rotate(41) scale(-1.12,1.12)">
      <path d="M-2,-56 C13,-57 24,-46 24,-30 C24,-15 18,-3 13,6 C9,12 -7,13 -11,6 C-15,-2 -20,-14 -20,-30 C-20,-45 -14,-55 -2,-56 Z" fill="#4A3521"/>
      <ellipse cx="1" cy="35" rx="17" ry="16" fill="#4A3521"/>
    </g>
    <g transform="translate(249.4,320.6) rotate(49) scale(1.12)">
      <path d="M-2,-56 C13,-57 24,-46 24,-30 C24,-15 18,-3 13,6 C9,12 -7,13 -11,6 C-15,-2 -20,-14 -20,-30 C-20,-45 -14,-55 -2,-56 Z" fill="#4A3521"/>
      <ellipse cx="1" cy="35" rx="17" ry="16" fill="#4A3521"/>
    </g>
    <g transform="translate(260.6,207.4) rotate(41) scale(-1.12,1.12)">
      <path d="M-2,-56 C13,-57 24,-46 24,-30 C24,-15 18,-3 13,6 C9,12 -7,13 -11,6 C-15,-2 -20,-14 -20,-30 C-20,-45 -14,-55 -2,-56 Z" fill="#4A3521"/>
      <ellipse cx="1" cy="35" rx="17" ry="16" fill="#4A3521"/>
    </g>
    <g transform="translate(373.8,196.2) rotate(49) scale(1.12)">
      <path d="M-2,-56 C13,-57 24,-46 24,-30 C24,-15 18,-3 13,6 C9,12 -7,13 -11,6 C-15,-2 -20,-14 -20,-30 C-20,-45 -14,-55 -2,-56 Z" fill="#4A3521"/>
      <ellipse cx="1" cy="35" rx="17" ry="16" fill="#4A3521"/>
    </g>
  </g>

  <!-- ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#9AA0A6" stroke-width="16"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#9AA0A6" stroke-width="3" stroke-opacity="0.45"/>
</svg>
