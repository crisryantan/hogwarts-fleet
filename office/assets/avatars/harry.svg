<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="field" gradientUnits="userSpaceOnUse" cx="176" cy="156" r="360">
      <stop offset="0" stop-color="#852E2E"/>
      <stop offset="1" stop-color="#7A1C1C"/>
    </radialGradient>
    <clipPath id="inner">
      <circle cx="256" cy="256" r="222" fill="#FFFFFF"/>
    </clipPath>
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#field)"/>

  <g clip-path="url(#inner)">
    <!-- lens tint -->
    <circle cx="180" cy="284" r="60" fill="#F3E6C4" fill-opacity="0.16"/>
    <circle cx="332" cy="284" r="60" fill="#F3E6C4" fill-opacity="0.16"/>

    <!-- lens glints -->
    <g stroke="#F3E6C4" stroke-opacity="0.55" stroke-width="9" stroke-linecap="round">
      <path d="M 146 266 A 40 40 0 0 1 172 244" fill="none"/>
      <path d="M 298 266 A 40 40 0 0 1 324 244" fill="none"/>
    </g>

    <!-- wire rims, bridge, temple stubs -->
    <g stroke="#F3E6C4" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="180" cy="284" r="60" fill="none"/>
      <circle cx="332" cy="284" r="60" fill="none"/>
      <path d="M 240 276 Q 256 258 272 276" fill="none"/>
      <line x1="121" y1="270" x2="106" y2="262" fill="none"/>
      <line x1="391" y1="270" x2="406" y2="262" fill="none"/>
    </g>

    <!-- lightning bolt -->
    <polygon points="278,112 236,176 260,176 240,232 292,160 266,160 300,112" fill="#E0B65C" stroke="#E0B65C" stroke-width="8" stroke-linejoin="round"/>
  </g>

  <circle cx="256" cy="256" r="240" fill="none" stroke="#6F93D6" stroke-width="16"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#6F93D6" stroke-width="3" stroke-opacity="0.45"/>
</svg>
