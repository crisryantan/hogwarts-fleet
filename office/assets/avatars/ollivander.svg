<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="field" gradientUnits="userSpaceOnUse" cx="176" cy="156" r="360">
      <stop offset="0" stop-color="#6B4478"/>
      <stop offset="1" stop-color="#55325F"/>
    </radialGradient>
    <clipPath id="inner">
      <circle cx="256" cy="256" r="222" fill="#FFFFFF"/>
    </clipPath>
  </defs>

  <!-- field -->
  <circle cx="256" cy="256" r="240" fill="url(#field)"/>

  <g clip-path="url(#inner)" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(-4 8)">
      <!-- wand box: long narrow tray with the lid slid half open -->
      <g transform="rotate(12 256 256)">
        <!-- tray shadow edge and body -->
        <rect x="106" y="234" width="210" height="80" rx="14" fill="#C9B48A"/>
        <rect x="106" y="226" width="210" height="80" rx="14" fill="#F3E6C4"/>
        <!-- open cavity -->
        <rect x="122" y="240" width="140" height="52" rx="8" fill="#3A2044"/>

        <!-- lid, slid over the right half -->
        <rect x="246" y="222" width="160" height="98" rx="16" fill="#A97D2C" stroke="url(#field)" stroke-width="8"/>
        <rect x="246" y="214" width="160" height="98" rx="16" fill="#E0B65C"/>
        <!-- lid detail bands -->
        <line x1="352" y1="230" x2="352" y2="296" fill="none" stroke="#A97D2C" stroke-width="9"/>
        <line x1="378" y1="230" x2="378" y2="296" fill="none" stroke="#A97D2C" stroke-width="9"/>
        <line x1="268" y1="240" x2="322" y2="240" fill="none" stroke="#A97D2C" stroke-width="9"/>
      </g>

      <!-- wand resting across the box, field-coloured edge to separate it -->
      <g>
        <line x1="140" y1="356" x2="372" y2="160" fill="none" stroke="url(#field)" stroke-width="32"/>
        <line x1="150" y1="347" x2="372" y2="160" fill="none" stroke="#F3E6C4" stroke-width="16"/>
        <line x1="140" y1="356" x2="196" y2="309" fill="none" stroke="#E0B65C" stroke-width="22"/>
        <line x1="186" y1="317" x2="196" y2="309" fill="none" stroke="#A97D2C" stroke-width="22"/>
        <circle cx="140" cy="356" r="14" fill="#A97D2C"/>
      </g>

      <!-- sparks from the wand tip -->
      <polygon points="404,118 411,139 432,146 411,153 404,174 397,153 376,146 397,139" fill="#E0B65C"/>
      <polygon points="338,98 342,110 354,114 342,118 338,130 334,118 322,114 334,110" fill="#F3E6C4"/>
      <polygon points="424,196 428,206 438,210 428,214 424,224 420,214 410,210 420,206" fill="#F3E6C4"/>
    </g>
  </g>

  <!-- rings -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#9AA0A6" stroke-width="16"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#9AA0A6" stroke-width="3" stroke-opacity="0.45"/>
</svg>
