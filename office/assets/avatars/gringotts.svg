<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="field" gradientUnits="userSpaceOnUse" cx="176" cy="156" r="360">
      <stop offset="0" stop-color="#4A3B25"/>
      <stop offset="1" stop-color="#3A2A12"/>
    </radialGradient>
    <!-- the same field gradient, expressed in the key's rotated frame so key cut-outs match the background -->
    <radialGradient id="fieldk" gradientUnits="userSpaceOnUse" cx="176" cy="156" r="360" gradientTransform="rotate(45) translate(-182.9,-326)">
      <stop offset="0" stop-color="#4A3B25"/>
      <stop offset="1" stop-color="#3A2A12"/>
    </radialGradient>
    <clipPath id="inner">
      <circle cx="256" cy="256" r="222" fill="#FFFFFF"/>
    </clipPath>
  </defs>

  <!-- field -->
  <circle cx="256" cy="256" r="240" fill="url(#field)"/>

  <g clip-path="url(#inner)">
    <!-- coins behind the key: tilted discs, a darker edge 8px below each face, edged with the field colour -->
    <ellipse cx="293.2" cy="161.5" rx="36" ry="28" fill="#7A5718" stroke="url(#field)" stroke-width="8"/>
    <ellipse cx="293.2" cy="153.5" rx="36" ry="28" fill="#A97D2C"/>
    <ellipse cx="225.3" cy="235" rx="52" ry="40" fill="#7A5718" stroke="url(#field)" stroke-width="8"/>
    <ellipse cx="225.3" cy="227" rx="52" ry="40" fill="#A97D2C"/>
    <ellipse cx="307.3" cy="274.6" rx="46" ry="36" fill="#7A5718" stroke="url(#field)" stroke-width="8"/>
    <ellipse cx="307.3" cy="266.6" rx="46" ry="36" fill="#A97D2C"/>

    <!-- vault key, drawn horizontally and set on the diagonal -->
    <g transform="translate(182.9,326) rotate(-45)">
      <!-- field-colour separation from the coins -->
      <circle cx="0" cy="0" r="68" fill="url(#fieldk)"/>
      <circle cx="-58" cy="0" r="26" fill="url(#fieldk)"/>
      <circle cx="0" cy="-58" r="26" fill="url(#fieldk)"/>
      <circle cx="0" cy="58" r="26" fill="url(#fieldk)"/>
      <rect x="42" y="-36" width="56" height="72" rx="14" fill="url(#fieldk)"/>
      <rect x="70" y="-25" width="224" height="50" rx="25" fill="url(#fieldk)"/>
      <rect x="204" y="0" width="82" height="82" rx="10" fill="url(#fieldk)"/>

      <!-- bit and teeth (shadow tone) -->
      <polygon points="214,10 276,10 276,72 258,72 258,54 244,54 244,72 228,72 228,44 214,44" fill="#A97D2C"/>

      <!-- shaft with shadowed underside -->
      <rect x="80" y="-15" width="204" height="30" rx="15" fill="#E0B65C"/>
      <path d="M86,4 L283.5,4 A15,15 0 0 1 269,15 L86,15 Z" fill="#A97D2C"/>

      <!-- collar -->
      <rect x="52" y="-26" width="36" height="52" rx="6" fill="#E0B65C"/>
      <line x1="70" y1="-26" x2="70" y2="26" fill="none" stroke="url(#fieldk)" stroke-width="8"/>

      <!-- ornate bow (shadow-tone inner band) with a quatrefoil opening -->
      <circle cx="0" cy="0" r="58" fill="#E0B65C"/>
      <circle cx="-58" cy="0" r="16" fill="#E0B65C"/>
      <circle cx="0" cy="-58" r="16" fill="#E0B65C"/>
      <circle cx="0" cy="58" r="16" fill="#E0B65C"/>
      <circle cx="0" cy="0" r="40" fill="#A97D2C"/>
      <circle cx="11" cy="0" r="12" fill="url(#fieldk)"/>
      <circle cx="-11" cy="0" r="12" fill="url(#fieldk)"/>
      <circle cx="0" cy="11" r="12" fill="url(#fieldk)"/>
      <circle cx="0" cy="-11" r="12" fill="url(#fieldk)"/>
    </g>
  </g>

  <!-- ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#9AA0A6" stroke-width="16"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#9AA0A6" stroke-width="3" stroke-opacity="0.45"/>
</svg>
