<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="field" gradientUnits="userSpaceOnUse" cx="176" cy="156" r="360">
      <stop offset="0" stop-color="#262A2C"/>
      <stop offset="1" stop-color="#13181A"/>
    </radialGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="256" cy="256" r="180">
      <stop offset="0" stop-color="#1E3B2C" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#1E3B2C" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1E3B2C" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="inner">
      <circle cx="256" cy="256" r="222" fill="#FFFFFF"/>
    </clipPath>
  </defs>

  <!-- field -->
  <circle cx="256" cy="256" r="240" fill="url(#field)"/>

  <g clip-path="url(#inner)" stroke-linecap="round" stroke-linejoin="round">
    <!-- faint green glow behind the flask -->
    <circle cx="256" cy="256" r="180" fill="url(#glow)"/>

    <!-- emblem: Erlenmeyer potion flask, lifted for optical centre -->
    <g transform="translate(0 -6)">
      <!-- faint glass tint -->
      <path fill="#F3E6C4" fill-opacity="0.14" d="M 234 156 V 196 L 166 326 Q 154 354 184 358 H 328 Q 358 354 346 326 L 278 196 V 156 Z"/>

      <!-- potion, two thirds full -->
      <path fill="#3E9B6A" d="M 206 250 Q 231 242 256 250 Q 281 258 306 250 L 346 326 Q 358 354 328 358 H 184 Q 154 354 166 326 Z"/>

      <!-- bubbles rising out of the potion -->
      <circle cx="264" cy="222" r="10" fill="#3E9B6A"/>
      <circle cx="252" cy="186" r="7" fill="#3E9B6A"/>

      <!-- glass highlight -->
      <path fill="none" stroke="#F3E6C4" stroke-width="8" stroke-opacity="0.5" d="M 296 274 L 316 312"/>

      <!-- graduation marks, left side -->
      <path fill="none" stroke="#F3E6C4" stroke-width="8" d="M 192 276 H 216 M 179 301 H 195 M 166 326 H 190"/>

      <!-- flask outline and lip -->
      <path fill="none" stroke="#F3E6C4" stroke-width="16" d="M 234 164 V 196 L 166 326 Q 154 354 184 358 H 328 Q 358 354 346 326 L 278 196 V 164"/>
      <line x1="224" y1="156" x2="288" y2="156" fill="none" stroke="#F3E6C4" stroke-width="16"/>

      <!-- cork -->
      <path fill="#C9B48A" d="M 232 110 H 280 L 274 150 H 238 Z"/>
    </g>
  </g>

  <!-- rings -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#D9A441" stroke-width="16"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#D9A441" stroke-width="3" stroke-opacity="0.45"/>
</svg>
