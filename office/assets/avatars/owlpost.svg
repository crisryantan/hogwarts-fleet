<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="field" gradientUnits="userSpaceOnUse" cx="176" cy="156" r="360">
      <stop offset="0" stop-color="#335A5F"/>
      <stop offset="1" stop-color="#1E4A4F"/>
    </radialGradient>
    <clipPath id="inner">
      <circle cx="256" cy="256" r="222" fill="#FFFFFF"/>
    </clipPath>
  </defs>

  <!-- field -->
  <circle cx="256" cy="256" r="240" fill="url(#field)"/>

  <g clip-path="url(#inner)">
    <!-- an owl feather tucked behind the envelope: long narrow vane, a split, and a bare quill tip -->
    <g transform="rotate(32 300 200)">
      <path d="M300 52 C330 84 336 146 326 204 L322 214 L300 200 L278 214 L274 204 C264 146 270 84 300 52 Z" fill="#C9B48A"/>
      <path d="M326 150 L338 142 L332 166 Z" fill="url(#field)"/>
      <path d="M300 70 L300 262" fill="none" stroke="#8C7A55" stroke-width="8" stroke-linecap="round"/>
      <path d="M300 110 L284 98 M300 140 L282 128 M300 170 L282 158 M300 110 L316 98 M300 140 L318 128 M300 170 L318 158" fill="none" stroke="#8C7A55" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- sealed envelope, tilted a little like it just landed -->
    <g transform="rotate(-8 256 270)">
      <rect x="112" y="180" width="288" height="188" rx="14" fill="#F3E6C4"/>
      <path d="M112 368 L256 278 L400 368 Z" fill="#C9B48A"/>
      <path d="M112 194 L112 368 L218 300 Z" fill="#E2D2A8"/>
      <path d="M400 194 L400 368 L294 300 Z" fill="#E2D2A8"/>
      <path d="M118 184 L256 290 L394 184" fill="none" stroke="#C9B48A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M126 186 L256 284 L386 186 Z" fill="#F3E6C4"/>
      <!-- wax seal -->
      <circle cx="256" cy="282" r="38" fill="#8E2A2A"/>
      <circle cx="256" cy="282" r="22" fill="none" stroke="#6A1D1D" stroke-width="8"/>
      <path d="M241 270 A20 20 0 0 1 262 262" fill="none" stroke="#B5524A" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ring and hairline: pewter, a script with no model -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#9AA0A6" stroke-width="16"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#9AA0A6" stroke-width="3" stroke-opacity="0.45"/>
</svg>
