# Fleet-owned Codex profile for Moody - Security Reviewer.
#
# run_desk passes every key below as `-c key=value`, together with
# --ignore-user-config and --ignore-rules, so ~/.codex/config.toml and every
# user or project execpolicy .rules file are never loaded. A loaded allow rule
# would run a matching command, such as git push, outside the sandbox.
# Format: flat dotted keys, one per line, TOML scalar values only. No tables.
#
# The sandbox comes from a permission profile run_desk builds and selects with
#   -c permissions.fleet-moody={...} -c default_permissions="fleet-moody"
# never from --sandbox. On 0.160.0 the --sandbox modes let commands read the whole disk.
# The profile is an allowlist:
#   - ":minimal" platform paths and /opt/homebrew, read
#   - the working folder (his task's worktree, else desks/moody/work), read
#   - ~/hogwarts/desks/moody and ~/hogwarts/tasks, read
#   - the repo's .git folder from the office worktree record, read
#   - ~/.hogwarts, denied by name; network off
# Proven on 0.160.0 by codex-boundary-test.sh (scripts/ in the fleet kit).
# This file must not set sandbox_mode, default_permissions, [permissions.*] or
# [sandbox_workspace_write]: run_desk refuses a profile that does.
# Never any bypass or auto-approve flag.

approval_policy = "never"
allow_login_shell = false
shell_environment_policy.inherit = "core"
shell_environment_policy.ignore_default_excludes = false
web_search = "disabled"
history.persistence = "none"
check_for_update_on_startup = false
analytics.enabled = false
features.hooks = false
features.memories = false
features.apps = false
features.tool_suggest = false
features.plugins = false
features.remote_plugin = false
features.skill_mcp_dependency_install = false
features.computer_use = false
features.browser_use = false
features.browser_use_external = false
